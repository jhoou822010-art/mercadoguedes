# Publica o Loja Fácil no GitHub Pages a cada envio (push) na branch main.
# Antes de usar: Settings → Pages → Source: "GitHub Actions"
# e cadastre em Settings → Secrets and variables → Actions (aba Secrets ou Variables):
#   VITE_SUPABASE_URL  e  VITE_SUPABASE_ANON_KEY
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicar manualmente pela aba Actions

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Conferir tipos (pnpm check)
        run: pnpm check

      - name: Conferir se as chaves do Supabase foram cadastradas
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          CHAVE: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          falta=""
          [ -z "$URL" ] && falta="$falta VITE_SUPABASE_URL"
          [ -z "$CHAVE" ] && falta="$falta VITE_SUPABASE_ANON_KEY"
          if [ -n "$falta" ]; then
            echo "::error::Não encontrei:$falta. Cadastre em Settings → Secrets and variables → Actions (aba Secrets ou Variables), NESTE repositório, com o nome exatamente igual (maiúsculas, sem espaços)."
            exit 1
          fi
          case "$URL" in
            https://*.supabase.co|https://*.supabase.co/) echo "URL do Supabase ok." ;;
            *) echo "::warning::VITE_SUPABASE_URL não parece uma URL do Supabase (esperado https://xxxx.supabase.co)." ;;
          esac

      - name: Gerar o site (pnpm build)
        run: pnpm build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      - name: Evitar que a publicação antiga do GitHub deixe o site em branco
        # Se Settings → Pages → Source ainda estiver em "Deploy from a branch", o GitHub publica
        # também os arquivos-fonte ao mesmo tempo (página em branco). Aqui esperamos essa
        # publicação terminar, para que a nossa (o site pronto) seja sempre a última.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tipo=$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null || echo "")
          echo "Tipo de publicação do GitHub Pages: ${tipo:-desconhecido}"
          if [ "$tipo" != "workflow" ]; then
            echo "::warning::Settings → Pages → Source não está em 'GitHub Actions'. Troque para 'GitHub Actions' para a publicação ficar mais rápida. Esperando a publicação automática do GitHub terminar…"
            for i in $(seq 1 30); do
              sleep 10
              pendentes=$(gh api "repos/$REPO/actions/runs?per_page=20" --jq '[.workflow_runs[] | select(.name=="pages build and deployment" and .status!="completed")] | length' 2>/dev/null || echo 0)
              echo "Publicações automáticas em andamento: $pendentes"
              if [ "$i" -ge 3 ] && [ "$pendentes" = "0" ]; then break; fi
            done
          fi

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v5
